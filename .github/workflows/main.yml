name: Build Apple Unity Plugins

on:
  workflow_dispatch:

jobs:
  build-tgz:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bypass Apple Prompts (Auto-Yes)
        run: |
          # Find the input prompt in the Python script and replace it to automatically return True
          sed -i '' 's/user_response = input()/return True/g' scripts/python/upi_utility.py

      - name: Build and Pack Native Libraries
        # -b all: Executes both build and pack actions.
        # -p all: Selects all available plugins.
        # -m iOS macOS: Targets Mobile and Mac platforms, skipping visionOS/tvOS.
        run: |
          python3 build.py -b all -p all -m iOS macOS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Plugins-TGZ
          path: Build/*.tgz